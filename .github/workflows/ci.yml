name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify (API 19 / ARMv7 / HMG-API / NEMESIS)
    runs-on: ubuntu-latest
    env:
      FITCAMX_CACHE_DIR: ${{ runner.temp }}/fitcamx-toolchain-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Android SDK (API 19 + Build-Tools 30.0.3) & HMG-API
        uses: actions/cache@v4
        with:
          path: ${{ env.FITCAMX_CACHE_DIR }}
          key: fitcamx-toolchain-${{ runner.os }}-api19-bt30.0.3-v1

      - name: Build APK, HMG-API & NEMESIS packages
        env:
          FITCAMX_KEYSTORE_BASE64: ${{ secrets.FITCAMX_KEYSTORE_BASE64 }}
          FITCAMX_KEYSTORE_PASS: ${{ secrets.FITCAMX_KEYSTORE_PASS }}
          FITCAMX_KEY_ALIAS: ${{ secrets.FITCAMX_KEY_ALIAS }}
          FITCAMX_KEY_PASS: ${{ secrets.FITCAMX_KEY_PASS }}
          FITCAMX_AUTHOR_KEY: ${{ secrets.FITCAMX_AUTHOR_KEY }}
          FITCAMX_AUTHOR_PUB: ${{ secrets.FITCAMX_AUTHOR_PUB }}
        run: ./build.sh

      - name: Run unit tests & binary invariant verification
        run: python3 tests/run_tests.py

      - name: Upload built ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: fitcamx-gen5w-packages
          path: dist/fitcamx-gen5w-v*.zip
          if-no-files-found: error
          retention-days: 14
